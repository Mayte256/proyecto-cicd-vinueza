# Stack Docker Swarm - Mayte Anahi Anchapanta Vinueza
version: '3.8'

services:
  vinueza-app:
    image: ghcr.io/mayte256/vinueza:1.0.5
    ports:
      - target: 5000
        published: 1001
        mode: host
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
      placement:
        constraints:
          - node.role == manager
    environment:
      - ESTUDIANTE=Mayte Anahi Anchapanta Vinueza
      - APELLIDO=Vinueza
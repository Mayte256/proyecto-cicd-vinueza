name: CI/CD Vinueza

on:
  push:
    branches: [ "Vinueza" ]

permissions:
  contents: read
  packages: write

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
    
    - name: 🐍 Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"
    
    - name: 📦 Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: 🧪 Run tests
      run: |
        pytest test_app.py -v
    
    - name: 🔐 Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: 🏗️ Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: |
          ghcr.io/mayte256/vinueza:1.0.5
          ghcr.io/mayte256/vinueza:latest
    
    - name: 📦 Copiar stack.yml y script fix_ssh a VPS
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        password: ${{ secrets.VPS_PASSWORD }}
        port: ${{ secrets.VPS_SSH_PORT }}
        source: |
          stack.yml
          fix_ssh.sh
        target: "/home/${{ secrets.VPS_USER }}/vinueza-deploy/"
    
    - name: 🚀 Ejecutar limpieza y deploy en VPS
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        password: ${{ secrets.VPS_PASSWORD }}
        port: ${{ secrets.VPS_SSH_PORT }}
        script: |
          echo "🔹 Ejecutando script de limpieza SSH..."
          chmod +x ~/vinueza-deploy/fix_ssh.sh
          ~/vinueza-deploy/fix_ssh.sh
          
          echo "🔹 Login a GHCR"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u mayte256 --password-stdin
          
          echo "📥 Pull latest image"
          docker pull ghcr.io/mayte256/vinueza:1.0.5
          
          echo "🛑 Removiendo stack anterior"
          docker stack rm vinueza || true
          sleep 15
          
          echo "🚀 Deploy stack nuevo"
          cd ~/vinueza-deploy
          docker stack deploy -c stack.yml vinueza --with-registry-auth
          
          echo "✅ Deploy completo"
          docker stack services vinueza
          echo "🔌 Puerto de aplicación: 1001"

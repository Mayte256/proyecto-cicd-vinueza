name: CI/CD Vinueza

on:
  push:
    branches: [ "Vinueza" ]
  pull_request:
    branches: [ "Vinueza" ]

permissions:
  contents: read
  packages: write

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🐍 Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"

    - name: 📦 Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest flake8

    - name: 🧪 Run tests
      run: |
        pytest test_app.py -v

    - name: 🔍 Lint with flake8
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: 🔐 Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: 🏗️ Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: |
          ghcr.io/mayte256/vinueza:1.0.5
          ghcr.io/mayte256/vinueza:latest

    - name: 📦 Copy stack.yml and fix_ssh.sh to VPS
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        password: ${{ secrets.VPS_PASSWORD }}
        port: ${{ secrets.VPS_SSH_PORT }}
        source: |
          stack.yml
          fix_ssh.sh
        target: "/home/${{ secrets.VPS_USER }}/vinueza-deploy/"

    - name: 🚀 Deploy to VPS
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        password: ${{ secrets.VPS_PASSWORD }}
        port: ${{ secrets.VPS_SSH_PORT }}
        script: |
          echo "🔹 Ejecutando limpieza SSH..."
          chmod +x ~/vinueza-deploy/fix_ssh.sh
          ~/vinueza-deploy/fix_ssh.sh

          echo "📥 Pull latest image"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u mayte256 --password-stdin
          docker pull ghcr.io/mayte256/vinueza:1.0.5

          echo "🛑 Deteniendo stack anterior"
          docker stack rm vinueza || true
          sleep 20

          echo "🚀 Desplegando stack nuevo"
          cd ~/vinueza-deploy
          docker stack deploy -c stack.yml vinueza --with-registry-auth

          echo "✅ Deploy completo"
          docker stack services vinueza
          echo "🔌 Puerto de aplicación: 1001"
          echo "🌐 Acceso: http://vinueza.byronrm.com"

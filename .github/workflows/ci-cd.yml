name: CI/CD Vinueza

on:
  push:
    branches: [ "Vinueza" ]
  pull_request:
    branches: [ "Vinueza" ]

permissions:
  contents: read
  packages: write

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🐍 Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"

    - name: 📦 Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install flake8 pytest

    - name: 🧪 Run tests
      run: pytest test_app.py -v

    - name: 🔐 Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: 🏗️ Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: |
          ghcr.io/mayte256/vinueza:1.0.5
          ghcr.io/mayte256/vinueza:latest

    - name: 🧾 Mostrar variables básicas
      run: |
        echo "Host: ${{ secrets.VPS_HOST }}"
        echo "Usuario: ${{ secrets.VPS_USER }}"
        echo "Puerto SSH: ${{ secrets.VPS_SSH_PORT }}"

    - name: 🧪 Probar conexión SSH
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        password: ${{ secrets.VPS_PASSWORD }}
        port: ${{ secrets.VPS_SSH_PORT }}
        script: |
          echo "✅ Conexión SSH exitosa"
          hostname
          whoami
          uptime

    - name: 📦 Copiar stack.yml a VPS
      uses: appleboy/scp-action@v1
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        password: ${{ secrets.VPS_PASSWORD }}
        port: ${{ secrets.VPS_SSH_PORT }}
        source: "stack.yml"
        target: "/home/${{ secrets.VPS_USER }}/vinueza-deploy/"

    - name: 🚀 Despliegue del stack
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        password: ${{ secrets.VPS_PASSWORD }}
        port: ${{ secrets.VPS_SSH_PORT }}
        script: |
          echo "🔐 Login a GHCR"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u mayte256 --password-stdin
          
          echo "📥 Descargar imagen"
          docker pull ghcr.io/mayte256/vinueza:1.0.5
          
          echo "🛑 Detener stack antiguo"
          docker stack rm vinueza || true
          sleep 15
          
          echo "🚀 Desplegar nuevo stack"
          cd /home/${{ secrets.VPS_USER }}/vinueza-deploy
          docker stack deploy -c stack.yml vinueza --with-registry-auth
          
          echo "✅ Deployment completo"
          echo "🌐 Puerto externo: 1004"
          docker stack services vinueza

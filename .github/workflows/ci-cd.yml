# CI/CD Pipeline - Mayte Anahi Anchapanta Vinueza
name: CI/CD Vinueza

on:
  push:
    branches: [ "Vinueza" ]

permissions:
  contents: read
  packages: write

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
    
    - name: 🐍 Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"
    
    - name: 📦 Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: 🧪 Run tests
      run: |
        pytest test_app.py -v
    
    - name: 🔐 Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: 🏗️ Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: |
          ghcr.io/mayte256/vinueza:1.0.5
          ghcr.io/mayte256/vinueza:latest
    
    - name: 📋 Show deployment info
      run: |
        echo "🎯 Desplegando para: Mayte Anahi Anchapanta Vinueza"
        echo "🏷️ Imagen: ghcr.io/mayte256/vinueza:1.0.5"
        echo "🌐 Subdominio: vinueza.byronrm.com"
        echo "🔌 Puerto: 1001"
    
    - name: 📦 Copy stack.yml to VPS
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        password: ${{ secrets.VPS_PASSWORD }}
        port: ${{ secrets.VPS_SSH_PORT }}
        source: "stack.yml"
        target: "/home/${{ secrets.VPS_USER }}/vinueza-deploy"
    
    - name: 🚀 Deploy to VPS
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        password: ${{ secrets.VPS_PASSWORD }}
        port: ${{ secrets.VPS_SSH_PORT }}
        script: |
          echo "🔐 Login to GHCR"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u mayte256 --password-stdin
          
          echo "📥 Pull latest image"
          docker pull ghcr.io/mayte256/vinueza:1.0.5
          
          echo "🛑 Remove old stack"
          docker stack rm vinueza || true
          sleep 15
          
          echo "🚀 Deploy new stack"
          cd /home/${{ secrets.VPS_USER }}/vinueza-deploy
          docker stack deploy -c stack.yml vinueza --with-registry-auth
          
          echo "✅ Deployment complete for Mayte Vinueza"
          echo "🌐 Acceso: http://vinueza.byronrm.com"
          echo "🔌 Puerto directo: http://161.97.140.245:1001"
          docker stack services vinueza